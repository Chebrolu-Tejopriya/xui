# Publishes the Storybook to GitHub Pages on every push to main.
#
# This is the surface the team actually reads — components, states, tokens and
# icons — so it deploys automatically rather than on someone remembering.
#
# One-time setup by a repo admin: Settings -> Pages -> Source: "GitHub Actions".
# Until that is switched on, this workflow builds fine and the deploy step fails.
name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `prepare` runs the library build here too, which is deliberate: if the
      # publishable package is broken, the docs should not ship either.
      - run: npm ci

      # Regenerate the agent contract from source and fail on any raw colour or
      # stray primitive. Docs that disagree with the code are worse than none.
      - run: npm run ds:check

      - run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
